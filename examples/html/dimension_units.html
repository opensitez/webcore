<!doctype html>
<meta charset="utf-8">
<title>CSS dimension units</title>
<style>
  body { margin: 0; font: 16px sans-serif }
  .case { width: 240px; margin: 12px; padding: 4px; border: 3px solid green }
  #escaped { padding: 10p\78 }
  #terminated { padding: 10\70 x }
  #exponent { padding: 1e1p\78 }
  #relative { padding: .5\72 em }
  #variable { --space: 12\70 x; padding: var(--space) }
  #invalid { padding: 0.; border-width: 1.px }
  #percent-unit { padding: 10\25 }
  @supports (padding: 10p\78) { #supports { padding: 10p\78 } }
</style>
<div class="case" id="escaped">Escaped unit</div>
<div class="case" id="terminated">Hex escape with terminator</div>
<div class="case" id="exponent">Exponent and escaped unit</div>
<div class="case" id="relative">Relative escaped unit</div>
<div class="case" id="variable">Variable unit</div>
<div class="case" id="invalid">Invalid numeric syntax preserves values</div>
<div class="case" id="percent-unit">Escaped percent is not a percentage</div>
<div class="case" id="supports">Shared feature-query parsing</div>
