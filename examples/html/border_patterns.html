<!doctype html>
<meta charset="utf-8">
<title>Border patterns</title>
<style>
  body { margin: 0; font: 16px sans-serif }
  .case { width: 200px; height: 64px; margin: 16px; background: lightblue; border: 6px dashed green }
  #dots { border-style: dotted }
  #round-dashes { border-radius: 20px }
  #round-dots { border-style: dotted; border-radius: 20px }
  #mixed { border-style: dashed dotted solid none }
  #double { border-style: double }
  #round-double { border-style: double; border-radius: 20px }
  #unequal-double { border-style: double; border-width: 6px 12px 9px 3px }
  #groove { border-style: groove }
  #ridge { border-style: ridge }
  #inset { border-style: inset }
  #outset { border-style: outset }
</style>
<div class="case" id="dashes">Dashes</div>
<div class="case" id="dots">Dots</div>
<div class="case" id="round-dashes">Rounded dashes</div>
<div class="case" id="round-dots">Rounded dots</div>
<div class="case" id="mixed">Mixed styles</div>
<div class="case" id="double">Double</div>
<div class="case" id="round-double">Rounded double</div>
<div class="case" id="unequal-double">Unequal double</div>
<div class="case" id="groove">Groove</div>
<div class="case" id="ridge">Ridge</div>
<div class="case" id="inset">Inset</div>
<div class="case" id="outset">Outset</div>
