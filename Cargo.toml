[package]
name = "webcore"
version = "0.4.0"
edition = "2024"
description = "HTML/CSS editor and renderer in Rust using tiny-skia"
license = "GPL-3.0-or-later OR LicenseRef-Commercial"
repository = "https://github.com/opensitez/webcore" 
readme = "README.md" 
keywords = ["html", "css", "web", "rendering"]
categories = ["gui", "rendering", "web-programming"]

[lib]
name = "webcore"
path = "src/lib.rs"

[[bin]]
name = "webcore"
path = "src/main.rs"

[[example]]
name = "animation_demo"
path = "examples/animation_demo.rs"

[[example]]
name = "transitions_demo"
path = "examples/transitions_demo.rs"

[[example]]
name = "contenteditable_demo"
path = "examples/contenteditable_demo.rs"

[[example]]
name = "markdown_demo"
path = "examples/markdown_demo.rs"

[[example]]
name = "print_demo"
path = "examples/print_demo.rs"

[[example]]
name = "layout_features"
path = "examples/layout_features.rs"

[[example]]
name = "cascade_features"
path = "examples/cascade_features.rs"

[[example]]
name = "transform_filter_demo"
path = "examples/transform_filter_demo.rs"

[[example]]
name = "event_playground"
path = "examples/event_playground.rs"

[[example]]
name = "demo"
path = "examples/demo.rs"

[features]
accessibility = ["dep:accesskit", "dep:accesskit_winit"]
audio-symphonia = ["webmedia/audio-symphonia"]

[dependencies]
webcanvas = "0.1.0"
webmedia = { version = "0.1.0", features = ["font"] }
accesskit        = { version = "0.17", optional = true }
accesskit_winit  = { version = "0.22", optional = true, features = ["rwh_06"] }
tiny-skia = "0.12"
winit = "0.30"
softbuffer = "0.4"
rfd = "0.14"
bytemuck = "1"
raw-window-handle = "0.6"

cosmic-text = "0.18.2"
fontdb = "0.23.0"
# Glyph OUTLINES, for `strokeText`. Already in the tree as cosmic-text's own
# dependency at this exact version — naming it here does not add a crate, it
# makes the outline API reachable. cosmic-text re-exports the rasteriser
# (`SwashCache`) but not `scale::ScaleContext`, and a filled glyph is not a
# stroked one.
swash = "0.2"
# `toDataURL`. Already in the tree; the canvas needs it to hand a page its own
# pixels, which is the only export route the spec gives a `<canvas>`.
base64 = "0.21"
unicode-bidi = "0.3"
unicode-segmentation = "1.13.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
png = "0.18"
zune-jpeg = "0.5"
encoding_rs = "0.8"
mime = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "brotli", "deflate", "charset", "http2", "system-proxy", "rustls-tls-native-roots"] }
# WOFF2 is Brotli-compressed. Already in the tree via reqwest's content
# encoding, so this only makes the existing dependency direct.
rayon = "1.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CGColorSpace", "CGDataProvider", "CGImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "CALayer", "CATransaction"] }
